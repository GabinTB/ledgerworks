name: CI

on:
  push:
    branches: ["main"]
    tags-ignore: ["v*"]      # tag pushes run release.yml, which runs the same checks first
  pull_request:
    branches: ["main"]
  workflow_call:             # release.yml reuses this job as its gate

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --group dev
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run pytest -q

  core-is-stdlib:
    # The core must import with no third-party package installed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
      - run: uv venv --clear --python 3.12 && uv pip install --python .venv --no-deps .
      - run: |
          .venv/bin/python -c "
          import ledgerworks, ledgerworks.jobs, ledgerworks.periods, ledgerworks.layout, ledgerworks.lineage
          print('core imports without numpy/pandas/polars:', ledgerworks.__version__)"

  example:
    # The CodeCheck package, offline (hashing backend; the model tests skip without the extra).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/codecheck
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --group dev
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest -q
      # check A: the committed scores follow from the committed embeddings (no model)
      - run: uv run codecheck-fomc rescore --no-model

  example-model:
    # The sentence-transformers backend on a tiny local model. macOS: PyPI ships
    # CPU-only torch wheels there, so the install stays small.
    runs-on: macos-latest
    defaults:
      run:
        working-directory: examples/codecheck
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --group dev --extra model
      - run: uv run pytest -q tests/test_model_backend.py
